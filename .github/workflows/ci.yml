name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Validate release structure
        run: python3 scripts/validate_release.py

      - name: Compile Python sources
        run: python3 -m py_compile plugins/delay-execute/scripts/*.py

      - name: Run unit and runner integration tests
        run: python3 -m unittest discover -s plugins/delay-execute/tests -v
